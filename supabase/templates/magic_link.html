<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tu enlace de acceso a PRITIO</title>
</head>
<body style="margin:0;padding:0;background-color:#F6F2FB;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F6F2FB;padding:36px 16px">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(124,58,237,0.10)">
          <!-- Accent strip -->
          <tr>
            <td style="height:6px;background:linear-gradient(90deg,#9B7EDC,#7C3AED)"></td>
          </tr>
          <!-- Logo -->
          <tr>
            <td style="padding:36px 32px 0;text-align:center">
              <table role="presentation" cellpadding="0" cellspacing="0" align="center">
                <tr>
                  <td style="width:44px;height:44px;background:linear-gradient(135deg,#9B7EDC,#7C3AED);border-radius:14px;text-align:center;vertical-align:middle;font-size:20px;font-weight:800;color:#ffffff;line-height:44px">P</td>
                </tr>
              </table>
              <h1 style="margin:20px 0 6px;font-size:22px;font-weight:800;color:#17121F;letter-spacing:-0.01em">Tu enlace de acceso</h1>
              <p style="margin:0;font-size:14px;color:#7C6E93">Entra a PRITIO con un solo clic</p>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:24px 40px;text-align:center">
              <p style="margin:0 0 28px;font-size:15px;color:#4B4453;line-height:1.6">
                Usa este enlace para iniciar sesión. Es personal e intransferible, no lo compartas con nadie.
              </p>
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 36px;background:linear-gradient(135deg,#9B7EDC,#7C3AED);color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;border-radius:12px;box-shadow:0 8px 20px rgba(124,58,237,0.28)">Iniciar sesión</a>
              <p style="margin:20px 0 0;font-size:12px;color:#A29BAE">¿El botón no funciona? Copia este enlace en tu navegador:</p>
              <p style="margin:4px 0 0;font-size:12px;color:#7C3AED;word-break:break-all">{{ .ConfirmationURL }}</p>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:0 40px 24px;text-align:center;border-top:1px solid #EFEAF7">
              <p style="margin:16px 0 0;font-size:11px;color:#A29BAE">PRITIO — Prioriza con claridad</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
